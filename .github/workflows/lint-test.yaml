name: Lint and test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Helm ${{ matrix.helm }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        helm: [v3.22.1, v4.3.1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ matrix.helm }}

      - name: helm lint + render every CI case
        run: |
          set -euo pipefail
          mkdir -p renders
          for chart in charts/*/; do
            name=$(basename "$chart")
            for values in "$chart"ci/*-values.yaml; do
              case_name=$(basename "$values" .yaml)
              helm lint --strict "$chart" -f "$values"
              helm template "$name" "$chart" -n ci -f "$values" > "renders/$name-$case_name.yaml"
            done
          done

      - name: Validate manifests (kubeconform)
        run: |
          docker run --rm -v "$PWD/renders:/r" ghcr.io/yannh/kubeconform:v0.8.0 \
            -strict -summary -kubernetes-version 1.30.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /r

  docs:
    name: README is generated
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          docker run --rm -v "$PWD:/helm-docs" -u "$(id -u)" jnorwood/helm-docs:v1.14.2
          git diff --exit-code -- '*.md' || {
            echo "::error::Chart READMEs are stale: run helm-docs and commit the result (see CONTRIBUTING.md)"
            exit 1
          }

  install:
    name: Install on kind (ct)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

      - name: ct lint (version bump, yamllint, maintainers)
        run: ct lint --config ct.yaml ${{ github.event_name == 'push' && '--all --check-version-increment=false' || '' }}

      - name: Changed charts
        id: changed
        run: |
          if [ "${{ github.event_name }}" = push ]; then echo "any=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -n "$(ct list-changed --config ct.yaml)" ]; then echo "any=true" >> "$GITHUB_OUTPUT"; fi

      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        if: steps.changed.outputs.any == 'true'

      # Installs every ci/*-values.yaml case and runs `helm test` on each.
      - name: ct install
        if: steps.changed.outputs.any == 'true'
        run: ct install --config ct.yaml ${{ github.event_name == 'push' && '--all' || '' }}
