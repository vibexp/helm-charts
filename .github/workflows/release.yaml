name: Release

# Publishes every chart whose Chart.yaml version has no release yet: pushes the
# package to oci://ghcr.io/vibexp/charts, signs it with cosign (keyless, this
# workflow's identity) and creates the GitHub release <chart>-<version>.
on:
  push:
    branches: [main]
    paths:
      - "charts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # GitHub release + tag
      packages: write   # ghcr.io
      id-token: write   # cosign keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.1

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Package, push, sign, release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY: ghcr.io/${{ github.repository_owner }}/charts
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          mkdir -p .cr-release-packages
          for chart in charts/*/; do
            name=$(helm show chart "$chart" | yq '.name')
            version=$(helm show chart "$chart" | yq '.version')
            tag="$name-$version"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag is already released"
              continue
            fi
            echo "::group::Releasing $tag"
            helm package "$chart" -d .cr-release-packages
            pkg=".cr-release-packages/$name-$version.tgz"
            out=$(helm push "$pkg" "oci://$REGISTRY" 2>&1); echo "$out"
            digest=$(echo "$out" | awk '/^Digest:/ {print $2}')
            [ -n "$digest" ] || { echo "::error::no digest in helm push output"; exit 1; }
            cosign sign "$REGISTRY/$name@$digest"
            app=$(helm show chart "$chart" | yq '.appVersion')
            # shellcheck disable=SC2016 # the backticks are Markdown, not command substitution
            notes=$(printf 'VibeXP %s.\n\n```sh\nhelm install vibexp oci://%s/%s --version %s\n```\n\nDigest: `%s`\n' "$app" "$REGISTRY" "$name" "$version" "$digest")
            gh release create "$tag" "$pkg" --title "$tag" --notes "$notes" --target "$GITHUB_SHA"
            echo "::endgroup::"
          done
