{{- if .Values.config.file }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vibexp.configMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vibexp.labels" (dict "ctx" . "component" "server") | nindent 4 }}
  {{- include "vibexp.annotations" (dict "ctx" .) | nindent 2 }}
data:
  config.yaml: |
    {{- tpl .Values.config.file . | nindent 4 }}
{{- end }}
