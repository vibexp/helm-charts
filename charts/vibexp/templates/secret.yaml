{{- if not .Values.secrets.existingSecret }}
{{- $name := include "vibexp.fullname" . }}
{{- $annotations := dict }}
{{- if .Values.secrets.keep }}{{ $_ := set $annotations "helm.sh/resource-policy" "keep" }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vibexp.labels" (dict "ctx" . "component" "server") | nindent 4 }}
  {{- include "vibexp.annotations" (dict "ctx" . "annotations" $annotations) | nindent 2 }}
type: Opaque
data:
  ENCRYPTION_KEY: {{ include "vibexp.secretValue" (dict "ctx" . "secret" $name "key" "ENCRYPTION_KEY" "value" .Values.secrets.encryptionKey "generate" (randAlphaNum 32)) | b64enc | quote }}
  SESSION_ENCRYPTION_KEY: {{ include "vibexp.secretValue" (dict "ctx" . "secret" $name "key" "SESSION_ENCRYPTION_KEY" "value" .Values.secrets.sessionEncryptionKey "generate" (randAlphaNum 64 | sha256sum)) | b64enc | quote }}
  {{- with .Values.secrets.apiKeyCommon }}
  API_KEY_COMMON: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.secrets.backofficeAdminApiKey }}
  BACKOFFICE_ADMIN_API_KEY: {{ . | b64enc | quote }}
  {{- end }}
  {{- if and (not .Values.postgresql.enabled) .Values.externalDatabase.password (not .Values.externalDatabase.existingSecret) }}
  DB_PASSWORD: {{ .Values.externalDatabase.password | b64enc | quote }}
  {{- end }}
{{- end }}
