{{- if include "vibexp.embeddings.active" . }}
{{- $name := include "vibexp.embeddings.fullname" . }}
{{- $e := .Values.embeddings }}
# The app reaches TEI by this name: the embedding provider URL entered in the
# app (Settings → Embedding Providers) is http://{{ $name }}:{{ $e.service.port }}.
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vibexp.labels" (dict "ctx" . "component" "embeddings") | nindent 4 }}
  {{- include "vibexp.annotations" (dict "ctx" . "annotations" $e.service.annotations) | nindent 2 }}
spec:
  {{- if $e.externalName }}
  type: ExternalName
  externalName: {{ $e.externalName }}
  {{- else }}
  type: ClusterIP
  {{- with $e.service.clusterIP }}
  clusterIP: {{ . }}
  {{- end }}
  selector:
    {{- include "vibexp.selectorLabels" (dict "ctx" . "component" "embeddings") | nindent 4 }}
  ports:
    - name: http
      port: {{ $e.service.port }}
      targetPort: http
      protocol: TCP
  {{- end }}
{{- if $e.enabled }}
{{- if and $e.persistence.enabled (not $e.persistence.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-cache
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vibexp.labels" (dict "ctx" . "component" "embeddings") | nindent 4 }}
  {{- include "vibexp.annotations" (dict "ctx" . "annotations" $e.persistence.annotations) | nindent 2 }}
spec:
  accessModes:
    {{- toYaml $e.persistence.accessModes | nindent 4 }}
  {{- include "vibexp.storageClass" $e.persistence.storageClass | nindent 2 }}
  resources:
    requests:
      storage: {{ $e.persistence.size }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vibexp.labels" (dict "ctx" . "component" "embeddings") | nindent 4 }}
  {{- include "vibexp.annotations" (dict "ctx" .) | nindent 2 }}
spec:
  replicas: 1
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  # The model cache is a ReadWriteOnce volume: stop the old pod first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "vibexp.selectorLabels" (dict "ctx" . "component" "embeddings") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vibexp.labels" (dict "ctx" . "component" "embeddings") | nindent 8 }}
        {{- with $e.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $e.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "vibexp.imagePullSecrets" (dict "ctx" . "secrets" .Values.imagePullSecrets) | nindent 6 }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with $e.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml $e.podSecurityContext | nindent 8 }}
      containers:
        - name: text-embeddings-inference
          image: {{ include "vibexp.image" (dict "image" $e.image "global" .Values.global "defaultTag" "") }}
          imagePullPolicy: {{ $e.image.pullPolicy }}
          securityContext:
            {{- toYaml $e.securityContext | nindent 12 }}
          args:
            - --model-id
            - {{ $e.model | quote }}
            {{- with $e.revision }}
            - --revision
            - {{ . | quote }}
            {{- end }}
            - --port
            - "8080"
            - --huggingface-hub-cache
            - /data
            {{- range $e.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: HOME
              value: /tmp
            {{- with $e.huggingfaceToken.existingSecret }}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $e.huggingfaceToken.key }}
            {{- end }}
            {{- with $e.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          {{- with $e.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $e.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $e.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml $e.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          {{- if $e.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-cache" $name) $e.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with $e.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $e.affinity }}
      affinity:
        {{- tpl (toYaml .) $ | nindent 8 }}
      {{- end }}
      {{- with $e.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
