apiVersion: v1
kind: Pod
metadata:
  name: {{ include "vibexp.fullname" . }}-test
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vibexp.labels" (dict "ctx" . "component" "test") | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: readyz
      image: {{ include "vibexp.image" (dict "image" .Values.tests.image "global" .Values.global "defaultTag" "") }}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      command: ["wget", "-q", "-O", "-", "http://{{ include "vibexp.fullname" . }}:{{ .Values.service.port }}/readyz"]
      resources:
        limits:
          memory: 32Mi
